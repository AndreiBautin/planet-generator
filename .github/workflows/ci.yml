name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # A lockfile that drifted from package.json fails here rather than
      # quietly resolving something different from what runs locally.
      - run: pnpm install --frozen-lockfile
      # The same one command as the pre-push hook, so the two cannot disagree.
      - run: pnpm verify
