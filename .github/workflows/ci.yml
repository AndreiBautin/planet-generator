name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      # A lockfile that drifted from package.json fails here rather than
      # quietly resolving something different from what runs locally.
      - run: pnpm install --frozen-lockfile
      # The same one command as the pre-push hook, so the two cannot disagree.
      - run: pnpm verify
      # What ships to the browser is three.js alone; a known hole in it
      # fails the build. Dev tools never reach a user, so are not audited here.
      - run: pnpm audit --prod
