name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      # A lockfile that drifted from package.json fails here rather than
      # quietly resolving something different from what runs locally.
      - run: pnpm install --frozen-lockfile
      # The same one command as the pre-push hook, so the two cannot disagree.
      - run: pnpm verify
      # What ships to the browser is three.js alone; a known hole in it
      # fails the build. Dev tools never reach a user, so are not audited here.
      - run: pnpm audit --prod
      # Every package comes from the registry with an integrity hash. A git
      # or tarball resolution skips the registry's checks and can change
      # under the same lockfile; refuse one rather than notice it later.
      - name: Lockfile resolves from the registry only
        run: |
          if grep -n 'resolution:' pnpm-lock.yaml | grep -v 'resolution: {integrity: sha512-'; then
            echo "A dependency resolves outside the npm registry."; exit 1
          fi
