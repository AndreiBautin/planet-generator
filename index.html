<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta
      name="description"
      content="A planet generated from a seed: terrain, seas, clouds and air. Every link is a world."
    />
    <title>Planet Generator</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Planets" />
    <style>
      :root {
        --ink: #e8eaf0;
        --dim: #9aa3b5;
        --glass: rgba(14, 18, 28, 0.62);
        --edge: rgba(255, 255, 255, 0.12);
        --accent: #7cc4ff;
        --gutter: max(16px, env(safe-area-inset-left));
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        /* The page never scrolls or zooms under a finger: the planet does. */
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }

      .title {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: var(--gutter);
        right: var(--gutter);
        pointer-events: none;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8);
      }
      .title h1 {
        margin: 0;
        font-size: clamp(26px, 6vw, 40px);
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      .title p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--dim);
        letter-spacing: 0.06em;
      }
      .title .seed {
        font-family: ui-monospace, 'Cascadia Mono', Menlo, monospace;
        color: var(--ink);
        opacity: 0.85;
      }

      .dock {
        position: fixed;
        left: var(--gutter);
        right: var(--gutter);
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }
      .dock > * {
        pointer-events: auto;
      }
      .actions {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 420px;
      }
      button {
        font: inherit;
        color: var(--ink);
        min-height: 48px;
        padding: 0 16px;
        border-radius: 14px;
        border: 1px solid var(--edge);
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        font-size: 15px;
        transition:
          transform 120ms ease,
          background 120ms ease;
      }
      button:active {
        transform: scale(0.96);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button[aria-pressed='true'] {
        border-color: var(--accent);
      }
      .primary {
        flex: 1;
        font-weight: 600;
        background: linear-gradient(180deg, rgba(124, 196, 255, 0.32), rgba(124, 196, 255, 0.14));
        border-color: rgba(124, 196, 255, 0.5);
      }

      .dials {
        width: 100%;
        max-width: 420px;
        box-sizing: border-box;
        padding: 14px 16px 6px;
        border-radius: 16px;
        border: 1px solid var(--edge);
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .dials[hidden] {
        display: none;
      }
      .dial {
        display: grid;
        grid-template-columns: 96px 1fr;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--dim);
      }
      .dial input {
        width: 100%;
        height: 36px;
        accent-color: var(--accent);
      }

      .toast {
        position: fixed;
        left: 50%;
        top: 40%;
        transform: translateX(-50%);
        margin: 0;
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--glass);
        border: 1px solid var(--edge);
        font-size: 14px;
        opacity: 0;
        transition: opacity 200ms ease;
        pointer-events: none;
      }
      .toast.shown {
        opacity: 1;
      }
      /* Flying, the hint says how to steer — once, fading after a few
         seconds, because it is only news the first time. */
      .hint {
        position: fixed;
        left: 50%;
        top: calc(max(16px, env(safe-area-inset-top)) + 84px);
        transform: translateX(-50%);
        margin: 0;
        padding: 8px 14px;
        border-radius: 12px;
        background: var(--glass);
        border: 1px solid var(--edge);
        font-size: 13px;
        color: var(--dim);
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
      }
      .flying .hint {
        animation: hint 6s ease forwards;
      }
      @keyframes hint {
        0%,
        100% {
          opacity: 0;
        }
        12%,
        75% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flying .hint {
          animation: none;
          opacity: 1;
        }
      }

      /* While a world is being made, its name breathes so the wait reads as
         work rather than as a frozen page. */
      .forming .title h1 {
        animation: forming 1.2s ease-in-out infinite alternate;
      }
      @keyframes forming {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .forming .title h1 {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="title">
      <h1 id="name">&nbsp;</h1>
      <p><span id="kind"></span> · seed <span class="seed" id="seed"></span></p>
    </header>

    <div class="dock">
      <section class="dials" id="dials" hidden aria-label="Dials">
        <label class="dial">
          Water
          <input id="dial-water" type="range" min="0" max="100" step="1" />
        </label>
        <label class="dial">
          Temperature
          <input id="dial-temperature" type="range" min="-100" max="100" step="1" />
        </label>
        <label class="dial">
          Roughness
          <input id="dial-roughness" type="range" min="0" max="100" step="1" />
        </label>
      </section>
      <nav class="actions" aria-label="Planet">
        <button type="button" id="tune" aria-pressed="false" aria-controls="dials">Tune</button>
        <button type="button" id="new" class="primary">New planet</button>
        <button type="button" id="fly" aria-pressed="false">Fly</button>
        <button type="button" id="share">Share</button>
      </nav>
    </div>

    <p class="hint" id="hint">Drag to steer and climb · pinch to change height</p>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
