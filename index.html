<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta
      name="description"
      content="A planet generated from a seed: terrain, seas, clouds and air. Every link is a world."
    />
    <title>Planet Generator</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Planets" />
    <style>
      :root {
        --ink: #e8eaf0;
        --dim: #9aa3b5;
        --glass: rgba(14, 18, 28, 0.62);
        --edge: rgba(255, 255, 255, 0.12);
        --accent: #7cc4ff;
        --gutter: max(16px, env(safe-area-inset-left));
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        /* The page never scrolls or zooms under a finger: the planet does. */
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }

      .title {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: var(--gutter);
        right: var(--gutter);
        /* Clear of the sound and picture buttons in the top-right corner. */
        padding-right: 114px;
        pointer-events: none;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8);
      }
      .title h1 {
        margin: 0;
        font-size: clamp(26px, 6vw, 40px);
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      .title p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--dim);
        letter-spacing: 0.06em;
      }
      /* Which build is running: small, out of the way, there to be read when asked. */
      .title .build {
        margin-top: 0.15rem;
        font-family: ui-monospace, 'Cascadia Mono', Menlo, monospace;
        font-size: 0.65rem;
        opacity: 0.45;
      }
      .title .seed {
        font-family: ui-monospace, 'Cascadia Mono', Menlo, monospace;
        color: var(--ink);
        opacity: 0.85;
      }

      /* The picture button sits apart, top right, out of the dock's crowd. */
      .photo {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        right: var(--gutter);
        width: 48px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      /* A sight's name as a guided tour reaches it: a lower third, once, fading. */
      .caption {
        position: fixed;
        left: var(--gutter);
        bottom: calc(max(16px, env(safe-area-inset-bottom)) + 80px);
        margin: 0;
        display: grid;
        gap: 2px;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.8s,
          transform 0.8s;
        pointer-events: none;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.85);
      }
      .caption.shown {
        opacity: 1;
        transform: none;
      }
      .caption strong {
        font-size: clamp(22px, 5vw, 32px);
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      .caption span {
        font-size: 13px;
        color: var(--dim);
        letter-spacing: 0.06em;
      }
      @media (prefers-reduced-motion: reduce) {
        .caption {
          transform: none;
        }
      }
      /* Sound sits beside the picture button: off until pressed. */
      .sound {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        right: calc(var(--gutter) + 58px);
        width: 48px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .sound .waves,
      .sound[aria-pressed='true'] .mute {
        display: none;
      }
      .sound[aria-pressed='true'] .waves {
        display: inline;
      }
      /* A shutter's blink when a picture is taken: once, fast, never a loop. */
      .flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      .flash.shot {
        animation: shot 0.35s ease-out;
      }
      @keyframes shot {
        from {
          opacity: 0.55;
        }
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flash.shot {
          animation: none;
        }
      }
      /* The atlas button sits under the picture button; the sheet covers the view. */
      .atlas-button {
        position: fixed;
        top: calc(max(16px, env(safe-area-inset-top)) + 58px);
        right: var(--gutter);
        width: 48px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .atlas[hidden],
      .atlas [hidden] {
        display: none;
      }
      .atlas {
        position: fixed;
        inset: 0;
        /* Over the view's own buttons, which are fixed too and come later. */
        z-index: 20;
        overflow-y: auto;
        box-sizing: border-box;
        padding: max(16px, env(safe-area-inset-top)) var(--gutter) 24px;
        background: rgba(5, 6, 10, 0.86);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .atlas-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 720px;
        margin: 0 auto;
      }
      .atlas h2 {
        margin: 0;
        font-size: 28px;
        font-weight: 650;
      }
      .atlas h3,
      .atlas-empty {
        max-width: 720px;
        margin: 18px auto 8px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .atlas-empty {
        text-transform: none;
        letter-spacing: 0;
        font-size: 15px;
      }
      .atlas-list {
        list-style: none;
        max-width: 720px;
        margin: 0 auto;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .atlas-card {
        position: relative;
      }
      .atlas-open {
        width: 100%;
        min-height: 0;
        padding: 10px;
        display: grid;
        gap: 8px;
        justify-items: center;
        text-align: center;
      }
      .atlas-picture {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #2a3550, #0b0f18) center / cover;
      }
      .atlas-words {
        display: grid;
        gap: 2px;
      }
      .atlas-words strong {
        font-size: 15px;
        font-weight: 600;
      }
      .atlas-words span {
        font-size: 12px;
        color: var(--dim);
      }
      .atlas-star {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 44px;
        min-height: 44px;
        padding: 0;
        font-size: 20px;
        border-color: transparent;
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      .atlas-star[aria-pressed='true'] {
        color: #ffd27a;
        border-color: transparent;
      }
      .touring .atlas-button,
      .postcarding .atlas-button {
        display: none;
      }
      /* Postcard mode: the view held, a frame over it, everything else away. */
      .postcard[hidden] {
        display: none;
      }
      .postcarding .title,
      .postcarding .dock,
      .postcarding .photo,
      .postcarding .sound,
      .postcarding .hint,
      .postcarding .caption {
        display: none;
      }
      .postcard-frame {
        position: fixed;
        overflow: hidden;
        pointer-events: none;
        outline: 1px solid rgba(255, 255, 255, 0.55);
        /* Everything outside the frame dims: what is left bright is the card. */
        box-shadow: 0 0 0 200vmax rgba(5, 6, 10, 0.55);
      }
      .postcard-grain {
        position: absolute;
        inset: 0;
        mix-blend-mode: overlay;
        background-repeat: repeat;
      }
      .postcard-thirds {
        position: absolute;
        inset: 0;
        --rule: rgba(255, 255, 255, 0.2);
        background:
          linear-gradient(
            to right,
            transparent calc(33.333% - 0.5px),
            var(--rule) 0 calc(33.333% + 0.5px),
            transparent 0 calc(66.667% - 0.5px),
            var(--rule) 0 calc(66.667% + 0.5px),
            transparent 0
          ),
          linear-gradient(
            to bottom,
            transparent calc(33.333% - 0.5px),
            var(--rule) 0 calc(33.333% + 0.5px),
            transparent 0 calc(66.667% - 0.5px),
            var(--rule) 0 calc(66.667% + 0.5px),
            transparent 0
          );
      }
      .postcard-words {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
        bottom: var(--margin);
        margin: 0;
        display: grid;
        gap: calc(var(--line) * 0.45);
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.75);
      }
      .postcard-words strong {
        font-size: var(--caption);
        font-weight: 650;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
      }
      .postcard-words span {
        font-size: var(--line);
        line-height: 1;
        font-weight: 500;
        color: rgba(232, 234, 240, 0.85);
      }
      .postcard-panel {
        position: fixed;
        left: var(--gutter);
        right: var(--gutter);
        bottom: max(12px, env(safe-area-inset-bottom));
        max-width: 420px;
        margin: 0 auto;
        box-sizing: border-box;
        padding: 12px 14px;
        display: grid;
        gap: 6px;
        border-radius: 16px;
        border: 1px solid var(--edge);
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .postcard-panel .dial {
        grid-template-columns: 96px 1fr;
        margin: 0;
      }
      .postcard-panel .dial input {
        height: 32px;
      }
      .postcard-panel output {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .framings {
        display: flex;
        gap: 6px;
      }
      .framings button {
        flex: 1;
        min-height: 40px;
        padding: 0;
      }
      .framings button[aria-checked='true'] {
        border-color: var(--accent);
      }
      /* Sixteen pixels, or a phone zooms the page when the field is touched. */
      #postcard-text {
        font: inherit;
        font-size: 16px;
        min-height: 44px;
        box-sizing: border-box;
        padding: 0 12px;
        border-radius: 12px;
        border: 1px solid var(--edge);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
      }
      .postcard-actions {
        display: flex;
        gap: 8px;
      }
      .postcard-actions button {
        flex: 1;
      }
      /* Touring, the chrome steps back so the view is the show. */
      .touring .title,
      .touring .sound,
      .touring .photo {
        opacity: 0.35;
        transition: opacity 0.6s;
      }

      .dock {
        position: fixed;
        left: var(--gutter);
        right: var(--gutter);
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }
      .dock > * {
        pointer-events: auto;
      }
      .actions {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 420px;
      }
      button {
        font: inherit;
        color: var(--ink);
        min-height: 48px;
        padding: 0 16px;
        border-radius: 14px;
        border: 1px solid var(--edge);
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        font-size: 15px;
        transition:
          transform 120ms ease,
          background 120ms ease;
      }
      button:active {
        transform: scale(0.96);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button[aria-pressed='true'] {
        border-color: var(--accent);
      }
      /* Four buttons at 375 pixels: a label that wraps doubles a button's
         height, and "New planet" did once Fly became the wider "Land". */
      .actions button {
        padding: 0 12px;
        white-space: nowrap;
      }
      /* Five buttons across a phone: closer together, so the bar fits a
         375-pixel screen without scrolling sideways. */
      @media (max-width: 420px) {
        .actions {
          gap: 6px;
        }
        .actions button {
          padding: 0 9px;
        }
      }
      .primary {
        flex: 1;
        font-weight: 600;
        background: linear-gradient(180deg, rgba(124, 196, 255, 0.32), rgba(124, 196, 255, 0.14));
        border-color: rgba(124, 196, 255, 0.5);
      }

      .dials {
        width: 100%;
        max-width: 420px;
        box-sizing: border-box;
        padding: 14px 16px 6px;
        border-radius: 16px;
        border: 1px solid var(--edge);
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .dials[hidden] {
        display: none;
      }
      .dial {
        display: grid;
        grid-template-columns: 96px 1fr;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--dim);
      }
      .dial input {
        width: 100%;
        height: 36px;
        accent-color: var(--accent);
      }

      .toast {
        position: fixed;
        left: 50%;
        top: 40%;
        transform: translateX(-50%);
        margin: 0;
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--glass);
        border: 1px solid var(--edge);
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 200ms ease;
        pointer-events: none;
      }
      .toast.shown {
        opacity: 1;
      }
      /* Flying, the hint says how to steer — once, fading after a few
         seconds, because it is only news the first time. */
      .hint {
        position: fixed;
        left: 50%;
        top: calc(max(16px, env(safe-area-inset-top)) + 84px);
        transform: translateX(-50%);
        margin: 0;
        padding: 8px 14px;
        border-radius: 12px;
        background: var(--glass);
        border: 1px solid var(--edge);
        font-size: 13px;
        color: var(--dim);
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
      }
      .flying .hint {
        animation: hint 6s ease forwards;
      }
      @keyframes hint {
        0%,
        100% {
          opacity: 0;
        }
        12%,
        75% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flying .hint {
          animation: none;
          opacity: 1;
        }
      }

      /* While a world is being made, its name breathes so the wait reads as
         work rather than as a frozen page. */
      .forming .title h1 {
        animation: forming 1.2s ease-in-out infinite alternate;
      }
      @keyframes forming {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .forming .title h1 {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="title">
      <h1 id="name">&nbsp;</h1>
      <p><span id="kind"></span> · seed <span class="seed" id="seed"></span></p>
      <p class="build" id="build"></p>
    </header>

    <div class="dock">
      <section class="dials" id="dials" hidden aria-label="Dials">
        <label class="dial">
          Water
          <input id="dial-water" type="range" min="0" max="100" step="1" />
        </label>
        <label class="dial">
          Temperature
          <input id="dial-temperature" type="range" min="-100" max="100" step="1" />
        </label>
        <label class="dial">
          Roughness
          <input id="dial-roughness" type="range" min="0" max="100" step="1" />
        </label>
        <label class="dial">
          Season
          <input id="dial-season" type="range" min="0" max="100" step="1" />
        </label>
      </section>
      <nav class="actions" aria-label="Planet">
        <button type="button" id="tune" aria-pressed="false" aria-controls="dials">Tune</button>
        <button type="button" id="new" class="primary">New planet</button>
        <button type="button" id="fly" aria-pressed="false">Fly</button>
        <button type="button" id="tour" aria-pressed="false">Tour</button>
        <button type="button" id="share">Share</button>
      </nav>
    </div>

    <button type="button" class="atlas-button" id="atlas-button" aria-label="Atlas of worlds">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path
          d="M4.5 12h15M12 4.5c2.3 2.2 2.3 12.8 0 15M12 4.5c-2.3 2.2-2.3 12.8 0 15"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
      </svg>
    </button>
    <section class="atlas" id="atlas" hidden aria-label="Atlas of worlds">
      <header class="atlas-head">
        <h2>Atlas</h2>
        <button type="button" id="atlas-close" aria-label="Close the atlas">Close</button>
      </header>
      <p class="atlas-empty" id="atlas-empty" hidden>Worlds you visit are filed here.</p>
      <h3 id="atlas-kept-heading" hidden>Kept</h3>
      <ul class="atlas-list" id="atlas-kept" hidden></ul>
      <h3>Visited</h3>
      <ul class="atlas-list" id="atlas-recent"></ul>
    </section>
    <button type="button" class="photo" id="photo" aria-label="Make a postcard">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path
          d="M4 8h3l2-2.5h6L17 8h3v11H4z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6" />
      </svg>
    </button>
    <button type="button" class="sound" id="sound" aria-pressed="false" aria-label="Sound on">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path
          d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <path
          class="waves"
          d="M15.5 9a4 4 0 0 1 0 6M18 7a7 7 0 0 1 0 10"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
        <path
          class="mute"
          d="M15.5 9.5l5 5M20.5 9.5l-5 5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <div class="postcard" id="postcard" hidden>
      <div class="postcard-frame" id="postcard-frame" aria-hidden="true">
        <div class="postcard-grain" id="postcard-grain"></div>
        <div class="postcard-thirds"></div>
        <p class="postcard-words">
          <strong id="postcard-caption-shown"></strong><span id="postcard-line"></span>
        </p>
      </div>
      <section class="postcard-panel" id="postcard-panel" aria-label="Postcard">
        <div class="framings" role="radiogroup" aria-label="Framing">
          <button type="button" role="radio" data-framing="screen" aria-checked="true">
            Screen
          </button>
          <button type="button" role="radio" data-framing="wide" aria-checked="false">3:2</button>
          <button type="button" role="radio" data-framing="tall" aria-checked="false">4:5</button>
          <button type="button" role="radio" data-framing="square" aria-checked="false">1:1</button>
        </div>
        <label class="dial">
          <span>Time <output id="postcard-time"></output></span>
          <input id="postcard-hour" type="range" min="0" max="1439" step="5" />
        </label>
        <label class="dial">
          <span>Height</span>
          <input id="postcard-height" type="range" min="0" max="1000" step="1" />
        </label>
        <label class="dial">
          <span>Grain</span>
          <input id="postcard-grain-dial" type="range" min="0" max="100" step="1" value="25" />
        </label>
        <input
          id="postcard-text"
          type="text"
          maxlength="48"
          aria-label="Caption"
          placeholder="Write a caption"
          autocomplete="off"
        />
        <div class="postcard-actions">
          <button type="button" id="postcard-cancel">Cancel</button>
          <button type="button" id="postcard-send" class="primary">Send postcard</button>
        </div>
      </section>
    </div>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <p class="hint" id="hint">Drag to steer and climb · pinch to change height</p>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
    <p class="caption" id="caption" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
